# The Vibe Dictionary: the closed set of typed changes a kid can make by
# talking to Bench (docs/design/sandbox-on-otherhere.md §3).
#
# The model's output is never a program; it is an index into this table. A
# value outside an entry's bounds, or an id not in the table, is a named
# refusal at parse time — never a clamp, never a fallback. The bounds are
# the hard limits: a thumbs-up can promote a Tier B entry into the
# dictionary, but it can never widen a bound here.
#
# The table is data in the harness so it is pinned by the harness's own
# identity (D27), and it is checkable without a model: a test reads it.
#
# Four entries in this slice (M2b): the units' vision, speed, tag range and
# stun time. The shape is the roadmap's §2.1, with the differences building
# it surfaced (see docs/ROADMAP-AHEAD.md §2.1): a `level` entry carries its
# bounds as min/max rather than an enumerated `levels` list, and `field`
# may name a `params.*` branchable field, because that is what the sim
# actually hashes per round. Each entry's comment says where its bounds
# come from: Params::validate where the code states them, and this file
# where it does not.

[[block]]
id = "unit.vision"                 # stable id; what Bench names out loud
says = ["let them see farther", "they should see farther", "wider eyes"]
field = "params.view_range_cells"  # the one field it writes; must be branchable
min = 4                            # bounds, inclusive; refused outside, never clamped
max = 64
default = 20                       # must equal the value Params ships, or load refuses
metric = "sight_ticks"             # the measure the default prediction watches
expect = "up"                      # up | down | either (either: bring your own prediction)
tier = "A"                         # A locked | B learnable
explain = "view_range_cells is how far a Dab sees, in 2 m cells (default 20 = 40 m); seeing farther should mean more eyes meeting, so more sight ticks and more tags traded"
age_ok = true                      # kid-safe vocabulary review passed

[[block]]
id = "unit.speed"
says = ["make them faster", "they should be quicker"]
field = "params.speed_upt"
min = 0                            # Params::validate: speed must be between 0 and one
max = 2048                         # cell per tick; one cell = cell_m (2) x 1024 units
default = 136
metric = "tags"
expect = "up"
tier = "A"
explain = "speed_upt is movement in units per tick (default 136 = about 4 m/s); faster Dabs close on each other sooner, so more tags should be traded"
age_ok = true

[[block]]
id = "unit.tag_range"
says = ["let them tag from farther away", "longer arms"]
field = "params.tag_range_units"
min = 1024                         # Params::validate states no bound for the tag range
max = 8192                         # (only the field's width); these are the sandbox's
default = 2048                     # own bounds, 1 m to 8 m, stated here so the check
                                   # is data, not memory
metric = "tags"
expect = "up"
tier = "A"
explain = "tag_range_units is how close a Dab must be to tag, in 1/1024 m units (default 2048 = 2 m); reaching farther should land more tags"
age_ok = true

[[block]]
id = "unit.stun_time"
says = ["make the stun shorter", "they should get up faster"]
field = "params.stun_ticks"
min = 0                            # Params::validate states no bound for the stun (only
max = 300                          # the field's width); these are the sandbox's own
default = 90                       # bounds, 0 to 10 s at 30 Hz, stated here so the
                                   # check is data, not memory
metric = "tags"
expect = "up"
tier = "A"
explain = "stun_ticks is how long a tagged Dab is frozen (default 90 = 3 s at 30 Hz); shorter stuns put everyone back in play sooner, so more tags should be traded"
age_ok = true

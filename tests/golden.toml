# The pinned golden hashes of the headless phase-1 rounds (spec section 10).
#
# One entry per seed: the last state hash of a round of `ticks` ticks started
# with `Header::default_round(seed, DEFAULT_REFLEX)` -- the shipped reflex, the
# default parameters and the `beacons` ruleset. A round ends as soon as a
# squad reaches the win score, so the last hash is the one of the tick the
# round ended on.
#
# These numbers are the contract. A change to the simulation moves them, and
# the commit that touches this file has to say why the world changed.
#
# These are the **world's** hashes, not the log's. A round's state hash is
# the simulation's own accounting of the game; the log's framing — the
# header's identity, the chain of segment hashes, the events a segment
# carries — is a different thing and moves on its own schedule. When the
# refusals were added to the log's segments (version 3, N2), the header's
# hash moved with the protocol version and the whole segment chain was
# re-rooted over it, and not one of the numbers below moved: the world did
# not change, so the world's hash did not change. The check that says so is
# `lm golden` itself — it says `OK 3/3` without this file being touched.
#
# Re-pinned for the fairness work: the beacons now come in 180-degree
# rotated pairs (an even count, the old layout put the centre beacon one
# cell closer to squad 1), the motor alternates its leading axis (the
# pinned axis could freeze two mirrored squads into a 0-0 standoff) and the
# acting order starts at the round's initiative, the point of the rotation
# the seed picks (the old order handed the first tag of most rounds to the
# same squad). The reflex is unchanged.
#
# **Not** re-pinned for the paint (M2a), and that is the point: the paint's
# bytes join the state hash only when there is paint, the way a branch's
# lineage joins the header's hash only when it is there. A round that never
# painted is the world it was before the paint existed, and it hashes as it
# did then — so the three numbers below still hold, and every log written
# before the paint still verifies against the hashes it recorded. `lm golden`
# says `OK 3/3` with these three numbers untouched.
#
# Measured, so the note is a fact and not a hope (the round played is the
# pinned one: seed, 3000 ticks, the shipped reflex, the default parameters):
#
# * **Seed 1** tags exactly once, at tick 1845, and the tag splats 9 cells.
#   The splat dries on its own (`dry_ticks` 150), so the paint is gone by
#   tick 1973 — and the round's last hash is at tick 2429, on a dry map. The
#   pinned hash therefore did not move, even though this seed painted.
# * **Seeds 2 and 3** never tag in 3000 ticks, so they never paint, and
#   their hashes are the hashes they were.
#
# A painted round's hashes *do* move: the paint is in them, and a round that
# painted and a round that did not are different games. `lm golden` cannot
# see that here, because the paint is dry by the time these three rounds
# take their last hash — which is the point of measuring rather than
# assuming.
#
# Regenerate with:
#     cargo run --release --bin lm -- golden --write

ticks = 3000

[golden]
1 = "0xe534c5ecf5bb8131"
2 = "0xcd8579867493dc41"
3 = "0x000cc5997abac698"

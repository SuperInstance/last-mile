[package]
name = "lm-router"
description = "The cloud purse: provider adapters, per-provider allotments and the exchange table (phase 5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The router is the only crate that spends money. It needs an HTTP client
# (ureq 3 with rustls, the same client phase 3 uses), JSON to speak the
# providers' dialects, TOML for `router.toml` and serde to hold the config.
# It never depends on lm-core: the sim stays model-free.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
# The tests read the providers' JSON and write their own fixtures.
serde_json = "1"

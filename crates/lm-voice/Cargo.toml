[package]
name = "lm-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "the voice service: the TTS/ASR traits, the stub backends, the Riva placeholders and the bark cache (phase 4 Task 5)"

[dependencies]
# The score and the hearing physics: the voice service is told what was
# said, and whether the human's ear can hear it.
lm-core = { path = "../lm-core" }
# The client's `audio.*` rules travel in a TOML file, like the agents' do.
serde = { version = "1", features = ["derive"] }
toml = "1"

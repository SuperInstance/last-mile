# The vibe gate's measurement fixture: kid-style phrasings, labelled with
# the change each one means (Vibe Dictionary part 3).
#
# 10 phrasings per dictionary entry (40), 10 that match nothing the
# dictionary holds, and 5 that are honestly ambiguous between two entries
# (`any` names every entry a fair hearing could pick). The live test runs
# every case through the vibe gate against the Thor's decision server and
# prints the accuracy table in docs/design/vibe-gate.md; the offline test
# checks that this file is the measurement it claims to be (10 per entry,
# 10 none, the ambiguous few, all distinct, all short enough to hear).
#
# The wording is a middle-schooler's: short, imperative, repetitive, with
# the game's own words (tag, stun, see) and without the dictionary's
# (units, parameters, view_range_cells). The exact `says` phrases of an
# entry are in its ten, and so are phrasings the dictionary never wrote
# down — the gate is measured on hearing, not on matching.

# ------------------------------------------------------------ unit.vision
[[case]]
words = "let them see farther"
entry = "unit.vision"

[[case]]
words = "they should see farther"
entry = "unit.vision"

[[case]]
words = "wider eyes"
entry = "unit.vision"

[[case]]
words = "I want them to see more"
entry = "unit.vision"

[[case]]
words = "make them notice things from far away"
entry = "unit.vision"

[[case]]
words = "they should see across the whole map"
entry = "unit.vision"

[[case]]
words = "their eyes should be better"
entry = "unit.vision"

[[case]]
words = "let my team see the other team sooner"
entry = "unit.vision"

[[case]]
words = "everyone keeps sneaking up, make them see it coming"
entry = "unit.vision"

[[case]]
words = "give them bigger vision"
entry = "unit.vision"


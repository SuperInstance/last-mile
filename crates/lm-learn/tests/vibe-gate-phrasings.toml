# ---------------------------------------------------------------- the none
# Ten asks the dictionary honestly does not hold: five are sandbox blocks
# that exist only in the design (docs/design/sandbox-on-otherhere.md §3),
# and five are not changes at all. The right answer for every one is
# `none` — Bench has no word for it yet.

[[case]]
words = "make the paint bouncy"
entry = "none"

[[case]]
words = "let's play somewhere else"
entry = "none"

[[case]]
words = "make the game longer"
entry = "none"

[[case]]
words = "give me another squad"
entry = "none"

[[case]]
words = "more crates please"
entry = "none"

[[case]]
words = "make the team more nervous"
entry = "none"

[[case]]
words = "change our color to yellow"
entry = "none"

[[case]]
words = "quiet match, no talking"
entry = "none"

[[case]]
words = "who is winning"
entry = "none"

[[case]]
words = "make the map bigger"
entry = "none"

# ----------------------------------------------------------- the ambiguous
# Five asks a fair hearing could land on either side of. `any` names every
# entry that counts as right; anything else the gate picks from the
# dictionary is a confusion worth reporting.

[[case]]
words = "make it easier to catch people"
any = ["unit.speed", "unit.tag_range"]

[[case]]
words = "they should be better at tagging"
any = ["unit.speed", "unit.tag_range"]

[[case]]
words = "let them see the other team from farther away"
any = ["unit.vision", "unit.tag_range"]

[[case]]
words = "make them get up and run faster"
any = ["unit.stun_time", "unit.speed"]

[[case]]
words = "the game is too slow"
any = ["unit.speed"]

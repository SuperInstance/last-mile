[package]
name = "lm-tools"
description = "The `lm` CLI: headless rounds, replay, diff and golden checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The crate is `lm-tools`; the command it builds is `lm`. `autobins = false`
# keeps that explicit: cargo infers no other binary, so `cargo run` always
# means the `lm` tool.
autobins = false

[[bin]]
name = "lm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# The `voice` subcommand plays its round with the stub minds of the
# shipped harness, so it needs the agents the host would attach. The
# agents do not depend on this crate (their lm-host-model edge is a
# dev-dependency), so this edge points one way only.
lm-agents = { path = "../lm-agents" }
lm-core = { path = "../lm-core" }
# The learning flow: the `learn` subcommand runs one learning round. The
# flow's crate does not depend on this one (that would be a cycle), so the
# flow plays its rounds with lm-core alone.
lm-learn = { path = "../lm-learn" }
# The voice lane: the skald client, the bank and the prefetch queue the
# `voice` subcommand reports on.
lm-voice = { path = "../lm-voice" }
# The vox subcommand: the performance protocol's analyzer and renderer.
lm-vox = { path = "../lm-vox" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

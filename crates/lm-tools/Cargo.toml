[package]
name = "lm-tools"
description = "The `lm` CLI: headless rounds, replay, diff and golden checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The crate is `lm-tools`; the command it builds is `lm`. `autobins = false`
# keeps that explicit: cargo infers no other binary, so `cargo run` always
# means the `lm` tool.
autobins = false

[[bin]]
name = "lm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
lm-core = { path = "../lm-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[package]
name = "lm-host-model"
description = "The host's model of a last-mile round: the host loop, the input mapping, the map and the piano roll."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The host model is pure logic and may be tested in WSL, so it depends on the
# core, on the headless runner and on the agents -- and on nothing else. No
# Bevy, no windowing stack, no clock: `lm-host` is a thin shell on top of this
# crate.
[dependencies]
lm-agents = { path = "../lm-agents" }
lm-core = { path = "../lm-core" }
# The learning flow: the between-round screen shows the flow's record, its
# sealed prediction and its verdict, and the human's answer goes back into it.
# The flow does not depend on this crate, so the edge points one way only.
lm-learn = { path = "../lm-learn" }
# The render side of the fog seam: the 2D map's fog and the 3D view's
# chunks are one rule, and it lives there (phase 6 Task 8) so the two
# views cannot drift.
lm-render = { path = "../lm-render" }
lm-tools = { path = "../lm-tools" }
# The voice service: the microphone path, the ASR and the prosody port.
lm-voice = { path = "../lm-voice" }
# The next round's header is JSON: the flow writes it, the host reads it.
serde_json = "1"

[dev-dependencies]
# The tests build the question pack a model is asked, to answer it.
serde_json = "1"
# The live test asks the Thor's voice for a wave and the Thor's ears for
# the words of it. The lane is behind `#[ignore]`: it needs the LAN.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# The voice wiring's tests prove the prefetch and the fallback against the
# loopback mock skald daemon, never a network.
lm-voice = { path = "../lm-voice", features = ["mocks"] }

[package]
name = "lm-host"
description = "The ProArt host app: Bevy 0.20 drawing for the last-mile sim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Pinned exactly: docs/notes/bevy-0.20.md records the API facts for these
# versions, and later tasks build on the notes rather than re-guessing.
# The `wav` feature is what lets Bevy decode the clips the voice backend
# makes: the host builds them as 16-bit mono waves.
bevy = { version = "=0.20.1", features = ["wav"] }
bevy_egui = "=0.43.1"

# The host is a thin shell: everything it draws comes from the host model,
# which is pure logic and is tested in WSL (lm-host itself cannot build
# there -- Bevy needs system libraries Linux has not).
lm-agents = { path = "../lm-agents" }
lm-core = { path = "../lm-core" }
lm-host-model = { path = "../lm-host-model" }
# The learning flow: it runs between the rounds, on its own thread, and the
# between-round screen shows what it decided.
lm-learn = { path = "../lm-learn" }
# The 3D view's pure half: the palette, the chunk meshes, the figures -- all
# of it plain data, all of it tested in WSL with no GPU.
lm-render = { path = "../lm-render" }
# The shipped reflex, so the host plays the same round the headless tools do.
lm-tools = { path = "../lm-tools" }
# The voice service: the microphone path, the ASR and the prosody port.
lm-voice = { path = "../lm-voice" }
